backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple
locale: "ru"
site_url: "/"
logo_url: "/assets/rum-logo-real.png"

collections:
  - name: "issues"
    label: "Выпуски журнала"
    delete: false
    editor:
      preview: false
    files:
      - name: "issues_data"
        label: "Список выпусков"
        file: "assets/content-issues.json"
        fields:
          - label: "Выпуски"
            name: "items"
            widget: "list"
            summary: "{{fields.year}} — № {{fields.num}}"
            fields:
              - {label: "ID", name: "id", widget: "string", required: false, hint: "Например: 2026-2"}
              - {label: "Год", name: "year", widget: "number", value_type: "int", min: 2018}
              - {label: "Номер", name: "num", widget: "number", value_type: "int", min: 1, max: 12}
              - {label: "Заголовок выпуска", name: "title", widget: "text"}
              - {label: "Обложка", name: "cover", widget: "image", choose_url: false, allow_multiple: false}
              - label: "Доступ"
                name: "access"
                widget: "select"
                options:
                  - {label: "Открытый архив", value: "open"}
                  - {label: "По подписке", value: "subscription"}
              - {label: "Ссылка на PDF", name: "pdf_link", widget: "string", required: false}
              - {label: "Старая страница выпуска", name: "page", widget: "string", required: false, hint: "Для уже существующих выпусков можно не менять"}
              - label: "Блоки выпуска"
                name: "sections"
                widget: "list"
                required: false
                fields:
                  - {label: "Название блока", name: "title", widget: "string"}
                  - {label: "Текст блока", name: "text", widget: "text"}
  - name: "news"
    label: "Новости"
    delete: false
    editor:
      preview: false
    files:
      - name: "news_data"
        label: "Список новостей"
        file: "assets/content-news.json"
        fields:
          - label: "Новости"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - {label: "ID", name: "id", widget: "string", required: false}
              - {label: "Дата", name: "date", widget: "string", hint: "Формат: 20.02.2026"}
              - {label: "Заголовок", name: "title", widget: "text"}
              - {label: "Картинка", name: "image", widget: "image", required: false, choose_url: false, allow_multiple: false}
              - {label: "Короткий анонс", name: "excerpt", widget: "text", required: false}
              - {label: "Основной текст", name: "body", widget: "text", required: false}
