backend:
  name: git-gateway
  branch: main

locale: 'ru'
publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: /
logo_url: /assets/rum-logo-real.png

collections:
  - name: "site_data"
    label: "Контент сайта"
    editor:
      preview: false
    files:
      - name: "issues"
        label: "Выпуски журнала"
        file: "assets/content-issues.json"
        format: "json"
        fields:
          - label: "Выпуски"
            name: "items"
            widget: "list"
            summary: "№ {{fields.num}} / {{fields.year}} — {{fields.title}}"
            fields:
              - {label: "Год", name: "year", widget: "number", value_type: "int", min: 2018, step: 1}
              - {label: "Номер", name: "num", widget: "number", value_type: "int", min: 1, step: 1}
              - {label: "Заголовок / тема выпуска", name: "title", widget: "string"}
              - {label: "Обложка", name: "cover", widget: "image", choose_url: false, allow_multiple: false}
              - label: "Тип доступа"
                name: "access"
                widget: "select"
                options:
                  - {label: "Открытый архив", value: "open"}
                  - {label: "По подписке", value: "subscription"}
              - {label: "Ссылка на PDF", name: "pdf", widget: "string", required: false}
              - {label: "Заголовок блока 1", name: "topic_heading", widget: "string", required: false, default: "Тема номера"}
              - {label: "Текст блока 1", name: "topic_text", widget: "text", required: false}
              - {label: "Заголовок блока 2", name: "law_heading", widget: "string", required: false, default: "Правовой вопрос"}
              - {label: "Текст блока 2", name: "law_text", widget: "text", required: false}
              - {label: "Заголовок блока 3", name: "norm_heading", widget: "string", required: false, default: "Нормативно-техническое обеспечение"}
              - {label: "Текст блока 3", name: "norm_text", widget: "text", required: false}
      - name: "news"
        label: "Новости"
        file: "assets/content-news.json"
        format: "json"
        fields:
          - label: "Новости"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - {label: "Дата", name: "date", widget: "string", hint: "Например: 20.02.2026"}
              - {label: "Заголовок", name: "title", widget: "string"}
              - {label: "Основной текст", name: "body", widget: "text"}
              - {label: "Картинка", name: "image", widget: "image", required: false, choose_url: false, allow_multiple: false}
